<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07142b">
<title>Помощник</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:ital,wght@0,500;0,700;1,700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07142b;--s1:#0d2147;--s2:#15325f;--line:#244579;--ink:#eaf1ff;--soft:#8ea5cf;--acc:#f5b94a;--ok:#4fd1a5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.4 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 48px}
.top{display:flex;align-items:center;gap:14px}
.ava{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);flex:none}
.day,h2,.h,.tile b{font-family:"Unbounded","Manrope",system-ui,Arial,sans-serif;font-weight:600}
.day{font-size:1.6rem;line-height:1.1}
.sub{color:var(--soft);font-size:.9rem;text-transform:capitalize}
.soft{color:var(--soft)}.sm{font-size:.85rem;margin:6px 0 0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:16px}
.h{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:.9rem}
.chip{font:600 .75rem "Manrope",sans-serif;color:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ffd98a);transition:width .4s}
.seg{display:flex;align-items:center;gap:6px;margin:12px 0 6px}.seg[hidden]{display:none}.seg span{flex:1}
.seg button{width:44px;padding:8px 0;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#241500;font-weight:700}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 8px;border:0;border-radius:12px;background:none;text-align:left}
.row.now{background:var(--s2);box-shadow:inset 0 0 0 1.5px var(--acc)}
.t{width:3.1em;flex:none;color:var(--soft);font-size:.9rem;font-variant-numeric:tabular-nums}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.15s}
.row[aria-checked=true] .box{background:var(--ok);border-color:var(--ok)}
.row[aria-checked=true] .box::after{content:"";width:6px;height:12px;border:solid #04261b;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row[aria-checked=true] .l{color:var(--soft);text-decoration:line-through}
.l{flex:1}
.tag{font-size:.7rem;font-weight:700;color:#241500;background:var(--acc);border-radius:99px;padding:2px 8px}
.gh{font-size:1.1rem;margin:26px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{position:relative;aspect-ratio:1/1.1;border:1px solid var(--line);border-radius:18px;background-size:cover;overflow:hidden;padding:0;text-align:left;color:#fff}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,20,43,.05) 35%,rgba(7,20,43,.92))}
.tile span{position:absolute;left:12px;right:12px;bottom:10px}
.tile b{display:block;font-size:.95rem}.tile small{color:#cfe0ff}
#sec{position:fixed;inset:0;z-index:5;overflow:auto;background:var(--bg);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility .3s}
#sec.on{transform:none;visibility:visible}
.back{background:none;border:0;color:var(--acc);padding:8px 0;font-weight:700}
.cover{height:150px;border-radius:18px;background-size:cover;margin-top:8px}
h2{font-size:1.4rem;margin:16px 0 4px}
.wk{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line)}.wk:last-child{border:0}
.wk.today{color:var(--acc);font-weight:700}
textarea{width:100%;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
#splash{position:fixed;inset:0;z-index:10;background:#000;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;animation:z 2.4s ease-out forwards}
@keyframes z{from{transform:scale(1.08)}to{transform:scale(1)}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,20,43,.1) 45%,rgba(7,20,43,.93))}
#quote{position:relative;margin:0;padding:0 28px calc(56px + env(safe-area-inset-bottom,0px));text-align:center;font:italic 700 clamp(1.25rem,5.6vw,1.7rem)/1.3 "Manrope",system-ui,Arial,sans-serif;text-wrap:balance}
.sbar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--acc);animation:l 2s linear forwards}
@keyframes l{to{width:100%}}
@media (prefers-reduced-motion:reduce){.ph,.sbar{animation:none}.sbar{width:100%}#sec,.bar i,.box{transition:none}}
</style>
</head>
<body>
<div id="splash"><div class="ph"></div><div class="shade"></div><p id="quote"></p><i class="sbar"></i></div>
<div class="wrap">
  <header class="top"><img id="ava" class="ava" alt="Аватар"><div><div class="day" id="day"></div><div class="sub" id="date"></div></div></header>
  <section class="card">
    <div class="h"><span>Сегодня</span><span class="chip" id="mode"></span></div>
    <div class="bar"><i id="pfill"></i></div><p class="soft sm" id="pcount"></p>
    <div class="seg" id="seg"><span class="soft sm">Первый урок</span><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button></div>
    <div id="plan"></div>
  </section>
  <h2 class="gh">Разделы</h2>
  <div class="grid" id="grid"></div>
</div>
<div id="sec"><div class="wrap"><button class="back" id="back">← Назад</button><div id="sbody"></div></div></div>

const POS={face:"50% 20%",body:"50% 35%"};
const QUOTES=["At the moment, I just disappear.","Будущий Сильвестр Сталлоне","Докажи им","Не разочаруй её","Пусть отец гордится тобой"];
const START=new Date(2026,9,27),SHIFT=55;
const WEEK=[[390,"Подъём",1],[400,"Умыться",1],[410,"Завтрак",1],[440,"Душ, убрать отёки",1],[470,"Одеться и выйти",1],[495,"Начало занятий",1],[840,"Конец занятий"],[870,"Сделать уроки"],[905,"Идти в зал"],[1025,"Вернуться из зала"],[1050,"Поесть и сесть за бизнес"],[1170,"Кружок (танцы)"],[1320,"Идти домой, поесть"],[1350,"Спать"]];
const WEND=[[540,"Подъём"],[570,"Завтрак"],[660,"Бизнес"],[840,"Развитие"],[1080,"Отдых и друзья"],[1350,"Спать"]];
const SPLIT=["Отдых","Руки и спина","Ноги и пресс","Руки и спина","Ноги и пресс","Руки и спина","Отдых"];
const SEC=[
{id:"school",n:"Школа",items:[["s1","Сделать уроки",1],["s2","Повторить тему дня",1],["s3","Собрать рюкзак",1]]},
{id:"body",n:"Тело",items:[["b1","Тренировка выполнена",1]],info:1},
{id:"face",n:"Лицо",items:[["f1","Упражнения для лица",1],["f2","Убрать отёки",1]]},
{id:"dev",n:"Развитие",items:[["d1","Учёба или чтение",1],["d2","Отдых",1],["d3","Общение с друзьями",1]],notes:1},
{id:"biz",n:"Бизнес",sub:"Направления. Отмечай, когда направление запущено.",items:[["z1","Сайты"],["z2","Товарка: Авито, Китай"],["z3","TikTok-аккаунт"]]},
{id:"ach",n:"Достижения",sub:"Цели на год.",items:[["a1","Пожать 100 кг"],["a2","Рост 180 см"],["a3","Отучиться на отлично"],["a4","Заработать денег"],["a5","Научиться рисовать"]]}];
let S={d:{},n:1,notes:""},cur="";
try{Object.assign(S,JSON.parse(localStorage.getItem("assistant-v1")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("assistant-v1",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const dk=()=>{const t=new Date();return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())};
const fmt=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const dayNo=()=>{const t=new Date(),a=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.min(365,Math.max(1,Math.round((a-START)/864e5)+1))};
const key=(id,d)=>d?dk()+"|"+id:id;
const done=(id,d)=>!!S.d[key(id,d)];
const flip=(id,d)=>{const k=key(id,d);if(S.d[k])delete S.d[k];else S.d[k]=1;save()};
function plan(){return new Date().getDay()%6===0?WEND.map((x,i)=>({id:"w"+i,t:x[0],l:x[1]})):WEEK.map((x,i)=>({id:"p"+i,t:x[0]+(x[2]?(S.n-1)*SHIFT:0),l:x[1]}))}
function main(){
  const t=new Date(),we=t.getDay()%6===0,pl=plan(),nm=t.getHours()*60+t.getMinutes();
  let c=-1;pl.forEach((p,i)=>{if(p.t<=nm)c=i});
  const n=pl.filter(p=>done(p.id,1)).length;
  $("day").textContent="День "+dayNo()+"/365";
  $("date").textContent=t.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
  $("pfill").style.width=(100*n/pl.length)+"%";$("pcount").textContent=n+" из "+pl.length;
  $("mode").textContent=we?"Выходной · пример":"Будни";$("seg").hidden=we;
  [...$("seg").querySelectorAll("button")].forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===S.n)));
  $("plan").innerHTML=pl.map((p,i)=>`<button class="row${i===c?" now":""}" role="checkbox" aria-checked="${done(p.id,1)}" data-id="${p.id}"><span class="t">${fmt(p.t)}</span><span class="box"></span><span class="l">${p.l}</span>${i===c?'<span class="tag">сейчас</span>':""}</button>`).join("");
  $("grid").innerHTML=SEC.map(s=>`<button class="tile" data-s="${s.id}" style="background-image:url(${IMG.cv[s.id]});background-position:${POS[s.id]||"center"}"><span><b>${s.n}</b><small>${s.items.filter(i=>done(i[0],i[2])).length}/${s.items.length}</small></span></button>`).join("");
}
function sec(reset){
  const s=SEC.find(x=>x.id===cur),td=new Date().getDay();
  const wk=s.info?`<div class="card"><p class="h">Неделя</p>${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map((d,i)=>{const w=(i+1)%7;return `<div class="wk${w===td?" today":""}"><span>${d}</span><span>${SPLIT[w]}</span></div>`}).join("")}</div>`:"";
  $("sbody").innerHTML=`<div class="cover" style="background-image:url(${IMG.cv[s.id]});background-position:${POS[s.id]||"center"}"></div><h2>${s.n}</h2>${s.sub?`<p class="soft">${s.sub}</p>`:""}<div class="card">${s.items.map(i=>`<button class="row" role="checkbox" aria-checked="${done(i[0],i[2])}" data-id="${i[0]}" data-d="${i[2]?1:0}"><span class="box"></span><span class="l">${i[1]}</span></button>`).join("")}</div>${wk}${s.notes?'<div class="card"><p class="h">Заметки</p><textarea id="nt" rows="6" placeholder="План развития, идеи, мысли"></textarea></div>':""}`;
  if(s.notes){$("nt").value=S.notes;$("nt").oninput=e=>{S.notes=e.target.value;save()}}
  $("sec").classList.add("on");if(reset)$("sec").scrollTop=0;
}
$("plan").onclick=e=>{const b=e.target.closest(".row");if(b){flip(b.dataset.id,1);main()}};
$("seg").onclick=e=>{const b=e.target.closest("button");if(b){S.n=+b.dataset.n;save();main()}};
$("grid").onclick=e=>{const b=e.target.closest(".tile");if(b){cur=b.dataset.s;sec(1)}};
$("sbody").onclick=e=>{const b=e.target.closest(".row");if(b){flip(b.dataset.id,+b.dataset.d);sec()}};
$("back").onclick=()=>{$("sec").classList.remove("on");main()};
setInterval(()=>{if(!$("sec").classList.contains("on"))main()},30000);
$("ava").src=IMG.av;
document.querySelector(".ph").style.backgroundImage="url("+IMG.bg[Math.floor(Math.random()*IMG.bg.length)]+")";
$("quote").textContent=QUOTES[Math.floor(Math.random()*QUOTES.length)];
main();
setTimeout(()=>{$("splash").classList.add("off");setTimeout(()=>$("splash").remove(),600)},2000);
</script>
</body>
</html>
